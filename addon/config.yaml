name: Govee to MQTT Bridge
image: ghcr.io/serjeleone/{arch}-govee2mqtt-addon
version: "2026-08-25"
slug: govee2mqtt-lite
description: Control Govee Devices
url: https://github.com/serjeleone/govee2mqtt
breaking_versions:
  - "2025.11.25-60a39bcc"
arch:
  - amd64
  - aarch64
init: false
boot: auto
startup: services
services:
  - mqtt:need

apparmor: true

webui: http://[HOST]:[PORT:8056]/assets/index.html

# Host network access is required for LAN discovery
host_network: true

map:
  - type: addon_config
    read_only: false
    path: /config

options:
  temperature_scale: "C"
  # Segment and DreamView commands always try LAN first. Cloud use is opt-in.
  lan_cloud_fallback: "disabled"

schema:
  temperature_scale: "str?"
  govee_email: "str?"
  govee_password: "password?"
  # One-shot verification code emailed by Govee after the first login attempt.
  govee_2fa_code: "password?"
  govee_api_key: "password?"
  mqtt_host: "str?"
  mqtt_port: "int?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  debug_level: "str?"
  no_multicast: "bool?"
  broadcast_all: "bool?"
  global_broadcast: "bool?"
  scan: "str?"
  lan_query_attempts: "int(1,100)?"
  lan_query_backoff_ms: "int(1,3000)?"
  lan_breaker_threshold: "int(0,)?"
  lan_breaker_cooldown: "int(30,900)?"
  lan_cloud_fallback: "list(disabled|iot|platform)"
  disable_effects: "bool?"
  allowed_effects: "str?"
  # Override the Govee Home app version string sent in API headers.
  # Set this when login fails with "The app version is too low".
  govee_app_version: "str?"
  # Experimental LAN-only custom music palette commands.
  music_palette: "bool?"
  # Advanced: polling interval in seconds (default 120).
  # Increase to 900 if you have many devices without IoT/LAN support
  # to avoid exceeding the Govee API rate limit (10,000 req/day).
  poll_interval: "int?"
