name: Verify, build and publish

on:
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  STANDALONE_IMAGE: ghcr.io/${{ github.repository }}
  SOURCE_URL: https://github.com/${{ github.repository }}
  ADDON_IMAGE_NAME: ${{ github.event.repository.name }}-addon
  ADDON_BASE_IDENTITY: https://github.com/home-assistant/docker-base/.*

permissions:
  contents: read

jobs:
  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.metadata.outputs.architectures }}
      matrix: ${{ steps.enrich-matrix.outputs.matrix }}
      version: ${{ steps.metadata.outputs.version }}
      addon_name: ${{ steps.metadata.outputs.addon_name }}
      addon_description: ${{ steps.metadata.outputs.addon_description }}
      addon_url: ${{ steps.metadata.outputs.addon_url }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate repository metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: ./scripts/ci-metadata.sh

      - name: Prepare Home Assistant architecture matrix
        id: ha-matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.metadata.outputs.architectures }}
          image-name: ${{ env.ADDON_IMAGE_NAME }}

      - name: Add build metadata to matrix
        id: enrich-matrix
        env:
          MATRIX: ${{ steps.ha-matrix.outputs.matrix }}
          BASE_IMAGES: ${{ steps.metadata.outputs.base_images }}
          PLATFORMS: ${{ steps.metadata.outputs.platforms }}
        run: |
          matrix="$(
            jq -c \
              --argjson base_images "$BASE_IMAGES" \
              --argjson platforms "$PLATFORMS" \
              '.include |= map(. + {
                base_image: $base_images[.arch],
                platform: $platforms[.arch]
              })' <<< "$MATRIX"
          )"

          if jq -e '.include[] | select(.base_image == null or .platform == null)' \
            <<< "$matrix" >/dev/null; then
            echo "::error::Architecture matrix is missing a base image or OCI platform"
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq . <<< "$matrix"

  verify:
    name: Verify source
    needs: initialize
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        # Keep warnings visible without making future stable-toolchain lints
        # break an otherwise valid release.
        run: cargo +stable clippy --all-targets --all-features

      - name: Build
        run: cargo +stable build --all

      - name: Run unit tests
        run: cargo +stable test --lib -- --show-output

      - name: Run LAN simulator tests
        run: cargo +stable test --test lan_simulator -- --show-output

      - name: Pull Mosquitto for integration tests
        run: docker pull eclipse-mosquitto:2

      - name: Run MQTT integration tests
        run: cargo +stable test --test mqtt_integration -- --test-threads=1 --show-output

  standalone:
    name: Standalone ${{ matrix.arch }}
    needs:
      - initialize
      - verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cross

      - name: Build executable
        run: ./scripts/build-cross.sh "${{ matrix.platform }}"

      - name: Log in to GHCR
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test standalone image
        if: github.event_name != 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          build-args: |
            SOURCE_URL=${{ env.SOURCE_URL }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.initialize.outputs.version }}

      - name: Build and push standalone image by digest
        if: github.event_name == 'release'
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ env.STANDALONE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SOURCE_URL=${{ env.SOURCE_URL }}
          labels: |
            org.opencontainers.image.source=${{ env.SOURCE_URL }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.initialize.outputs.version }}

      - name: Export digest
        if: github.event_name == 'release'
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: standalone-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  standalone-manifest:
    name: Publish standalone manifest
    if: github.event_name == 'release'
    needs:
      - initialize
      - standalone
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: standalone-digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ${{ env.STANDALONE_IMAGE }}
          VERSION: ${{ needs.initialize.outputs.version }}
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${sources[@]}"

          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  addon-test:
    name: Test add-on ${{ matrix.arch }}
    if: github.event_name != 'release'
    needs:
      - initialize
      - verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Test Home Assistant add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ matrix.image }}
          image-tags: test
          version: ${{ needs.initialize.outputs.version }}
          push: "false"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            GOVEE2MQTT_IMAGE=${{ env.STANDALONE_IMAGE }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.initialize.outputs.addon_name }}
            io.hass.description=${{ needs.initialize.outputs.addon_description }}
            io.hass.url=${{ needs.initialize.outputs.addon_url }}
            org.opencontainers.image.licenses=MIT

  addon-publish:
    name: Publish add-on ${{ matrix.arch }}
    if: github.event_name == 'release'
    needs:
      - initialize
      - standalone-manifest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.initialize.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build, sign and publish Home Assistant add-on image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: addon
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.initialize.outputs.version }}
            latest
          version: ${{ needs.initialize.outputs.version }}
          push: "true"
          cosign: "true"
          cosign-base-verify: ${{ matrix.base_image }}
          cosign-base-identity: ${{ env.ADDON_BASE_IDENTITY }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            GOVEE2MQTT_IMAGE=${{ env.STANDALONE_IMAGE }}:${{ needs.initialize.outputs.version }}
          labels: |
            io.hass.type=addon
            io.hass.name=${{ needs.initialize.outputs.addon_name }}
            io.hass.description=${{ needs.initialize.outputs.addon_description }}
            io.hass.url=${{ needs.initialize.outputs.addon_url }}
            org.opencontainers.image.licenses=MIT
